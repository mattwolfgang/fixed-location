<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font: 13px system-ui, sans-serif; width: 240px; margin: 12px; }
    label { display: block; margin-bottom: 8px; }
    input[type=text], input[type=number] { width: 100%; box-sizing: border-box; padding: 4px; }
    input.invalid { border-color: #c62828; outline-color: #c62828; }

    .switch { display: flex; align-items: center; justify-content: space-between;
              font-weight: 600; margin-bottom: 12px; cursor: pointer; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .track { position: relative; width: 36px; height: 20px; border-radius: 10px;
             background: #9e9e9e; transition: background 0.15s; flex-shrink: 0; }
    .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
                    border-radius: 50%; background: #fff; transition: transform 0.15s; }
    .switch input:checked + .track { background: #2e7d32; }
    .switch input:checked + .track::after { transform: translateX(16px); }
    .switch input:focus-visible + .track { outline: 2px solid #1565c0; outline-offset: 2px; }

    #status { color: #2e7d32; min-height: 1.2em; }
    #status.error { color: #c62828; }
  </style>
</head>
<body>
  <label class="switch">Use fixed location
    <input type="checkbox" role="switch" id="enabled"><span class="track"></span>
  </label>
  <label>Latitude <input type="text" id="latitude" title="You can also paste &quot;lat, lon&quot; here"></label>
  <label>Longitude <input type="text" id="longitude"></label>
  <label>Accuracy (meters) <input type="number" id="accuracy" min="1"></label>
  <div id="status"></div>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
