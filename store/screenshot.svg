<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800"
     font-family="Liberation Sans, Arial, sans-serif">
  <!-- Store screenshot. Render with: rsvg-convert store/screenshot.svg -o store/screenshot-1280x800.png
       The popup is drawn to match popup.html, at 1.6x so it reads at listing size. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f5e9"/><stop offset="1" stop-color="#f5f5f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.18"/>
    </filter>
    <g id="pin">
      <path d="M64 12c-21.5 0-39 17-39 38.2C25 79 64 116 64 116s39-37 39-65.8C103 29 85.5 12 64 12z" fill="#2e7d32"/>
      <path d="M42 54 64 34l22 20v20H42z" fill="#fff"/>
      <rect x="58" y="60" width="12" height="14" fill="#2e7d32"/>
    </g>
  </defs>
  <rect width="1280" height="800" fill="url(#bg)"/>

  <use href="#pin" transform="translate(84 150) scale(0.8)"/>
  <text x="100" y="300" font-size="54" font-weight="bold" fill="#1b1b1b">Fixed Location</text>
  <g font-size="25" fill="#424242">
    <text x="100" y="370">No GPS, and the only Wi-Fi network</text>
    <text x="100" y="406">around is yours? Websites can't work</text>
    <text x="100" y="442">out where you are.</text>
    <text x="100" y="510">Enter your coordinates once and switch</text>
    <text x="100" y="546">it on. Maps, weather and store finders</text>
    <text x="100" y="582">then get your real location.</text>
  </g>

  <!-- Browser window with the toolbar icon and open popup. -->
  <g transform="translate(720 175)">
    <rect width="480" height="450" rx="14" fill="#fff" filter="url(#shadow)"/>
    <path d="M0 14a14 14 0 0 1 14-14h452a14 14 0 0 1 14 14v42H0z" fill="#eceff1"/>
    <use href="#pin" transform="translate(436 14) scale(0.22)"/>
    <rect x="446" y="34" width="24" height="14" rx="3" fill="#2e7d32"/>
    <text x="458" y="45" font-size="10" font-weight="bold" fill="#fff" text-anchor="middle">ON</text>

    <g transform="translate(46 70) scale(1.6)">
      <rect width="264" height="222" rx="6" fill="#fff" stroke="#d6d6d6"/>
      <g font-size="13" fill="#1b1b1b">
        <text x="12" y="27" font-weight="bold">Use fixed location</text>
        <rect x="216" y="12" width="36" height="20" rx="10" fill="#2e7d32"/>
        <circle cx="242" cy="22" r="8" fill="#fff"/>

        <text x="12" y="56">Latitude</text>
        <rect x="12.5" y="60.5" width="239" height="24" rx="2" fill="#fff" stroke="#8f8f8f"/>
        <text x="17" y="77">44.9537</text>

        <text x="12" y="105">Longitude</text>
        <rect x="12.5" y="109.5" width="239" height="24" rx="2" fill="#fff" stroke="#8f8f8f"/>
        <text x="17" y="126">-93.09</text>

        <text x="12" y="154">Accuracy (meters)</text>
        <rect x="12.5" y="158.5" width="239" height="24" rx="2" fill="#fff" stroke="#8f8f8f"/>
        <text x="17" y="175">10</text>

        <text x="12" y="205" fill="#2e7d32">Saved</text>
      </g>
    </g>
  </g>
</svg>
